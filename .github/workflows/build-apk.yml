name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      embed_keys:
        description: 'Embed API keys in APK? (not recommended)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Buildozer & Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip
          pip install --upgrade buildozer cython==0.29.36
          # Pin python-for-android to avoid Python 3.14 (cgi removed in 3.13+)
          pip install python-for-android==2024.1.21

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-agent-apk
          path: android-app/bin/*.apk
